name: DCO

# Every commit in a pull request must carry a Developer Certificate of Origin sign-off
# (`Signed-off-by: Name <email>`, added by `git commit -s`) whose email is the commit
# author's. Each repository's CONTRIBUTING.md (or README) explains why.
# Merge commits and bot commits (Dependabot) are exempt.
#
# This is the one copy of the check: every public repository calls it from its own
# `.github/workflows/dco.yml`:
#
#   on:
#     pull_request:
#   permissions:
#     contents: read
#   jobs:
#     dco:
#       uses: synthaea-lab/.github/.github/workflows/dco.yml@main
#
# `pull_request` also runs it on this repository's own pull requests, so a change to the
# check is exercised before callers pick it up.

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    # The base..head range only exists on a pull request; a caller wired to another event
    # skips instead of checking an empty range.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            case "$email" in
              *'[bot]@users.noreply.github.com') continue ;;
            esac
            if ! git log -1 --format=%B "$c" | grep -i '^Signed-off-by:' | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no 'Signed-off-by: ... <$email>' line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off your commits: 'git commit -s' for new ones, 'git rebase --signoff $BASE' for these, then force-push."
            exit 1
          fi
          echo "All commits are signed off."
